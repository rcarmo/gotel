name: CI

on:
  pull_request:
  push:
    branches: [ main ]

jobs:
  check:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Install dependencies
        run: make deps

      - name: Run checks
        run: make check test-race

      - name: Set up Bun for integration smoke test
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.1

      - name: Run executable and web smoke test
        run: make deps-frontend smoke

  frontend:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.1

      - name: Install dependencies
        run: make deps-frontend

      - name: Type check
        run: make build-frontend

      - name: Run tests
        run: make test-frontend

      - name: Build clean-checkout container images
        run: |
          docker build -t gotel:ci .
          docker build -f Dockerfile.web -t gotel-web:ci .
